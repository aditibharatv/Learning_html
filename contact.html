
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>

<body>

    <header>
        <h1>Contact Us</h1>
        <p>Welcome to Microsoft Contact Page</p>
        <hr>
    </header>

    <main>
        <section>
          <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d121004.65917297197!2d73.59480059726563!3d18.601268100000013!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2bb007412ed31%3A0xf6e2e59304e22285!2sMicrosoft%20Surface%20Service%20center!5e0!3m2!1sen!2sin!4v1792215262930!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>  
        </section>
        <section>
            <h2>Contact Form</h2>
            <p>Please fill in the form below to contact us.</p>

            <form>
                <label for="fname">First Name:</label>
                <input type="text"  placeholder="Enter your Name" required>
                <br><br>

                <label for="lname">Last Name:</label>
                <input type="text" placeholder="Enter Last Name" required>
                <br><br>

                <label for="email">Enter Email:</label>
                <input type="email" placeholder="Enter Email" required>
                <br><br>

                <label for="fax">Enter Fax Number:</label>
                <label> Enter Fax Number</label>
        <input type="number" placeholder="Enter Fax Number">
        
                <br><br>

                <input type="submit" value="Submit">
            </form>
        </section>
    </main>

   
    <footer>
        <hr>

    </footer>

</body>
