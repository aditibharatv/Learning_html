<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body>

    <!-- Rowspan Example -->
    <h2>Table Rowspan Example</h2>

    <table border="2">
        <thead>
            <tr>
                <th>Languages</th>
                <th>Details</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="5">Web Design</td>
                <td>HTML</td>
            </tr>
            <tr>
                <td>CSS</td>
            </tr>
            <tr>
                <td>Bootstrap</td>
            </tr>
            <tr>
                <td>JavaScript</td>
            </tr>
        </tbody>
    </table>


    <hr>


    <!-- Colspan Example -->
    <h2>Table Colspan Example</h2>

    <table border="2">
                <thead>
            <tr>
                <th>Languages</th>
                <th>Details</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td colspan="5">Web Design</td>
                <td>HTML</td>
                
            </tr>

            <tr>
                <td>CSS</td>
                
            </tr>

            <tr>
                <td>Bootstrap</td>
                
            </tr>

            <tr>
                <td>JavaScript</td>
               
            </tr>
        </tbody>
        <hr>
        <tbody>

            <tr>
                <td colspan="5">graphic design</td>
                <td>canva</td>
                
            </tr>

            <tr>
                <td>figma</td>
                
            </tr>

            <tr>
                <td>adoba</td>
                
            </tr>

            <tr>
                <td>CorelDRAW</td>
               
            </tr>
        </tbody>
    </table>

</body>
</html>
